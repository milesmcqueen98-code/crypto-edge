name: owner-status

# Refreshes reports/owner/PAPER_STATUS.md from the four paper logs and commits it to main when it changed.
on:
  workflow_run:
    workflows: ["paper-spot", "paper-trade", "paper-spot-t18"]
    types: [completed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: owner-status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/owner
            reports/owner
            bot/spot/deploy
            paper_spot
            paper_spot_w2
            paper_spot_tb
            paper_spot_t18
            paper
            paper_v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Write the status report
        run: python scripts/owner/paper_status.py .
      - name: Commit the report
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "crypto-edge-bot.users.noreply.github.com"
          bash bot/spot/deploy/paper_commit.sh "Paper status $(date -u +%Y-%m-%dT%H:%MZ)" reports/owner/PAPER_STATUS.md
