name: owner-status

# Refreshes reports/owner/PAPER_STATUS.md from the four paper logs and commits it to main when it changed.
on:
  workflow_run:
    workflows: ["paper-spot", "paper-trade"]
    types: [completed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: owner-status
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/owner
            reports/owner
            paper_spot
            paper_spot_w2
            paper
            paper_v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Write the status report
        run: python scripts/owner/paper_status.py .
      - name: Commit the report
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "crypto-edge-bot.users.noreply.github.com"
          git add reports/owner/PAPER_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Paper status $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done
