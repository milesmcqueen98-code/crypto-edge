name: ladder-prints

# Ladder v5 (reports/ladder_v5_prereg.md): per-event print statistics from the ladder-fetch trade artifacts. On branch
# ladder/v6x-kappa: the kappa(m) measurement of ladder v6 exits (scripts/ladder_v6x/kappa/prints_kappa.py, then
# kappa.py). Only derived per-event numbers are committed (and kept as the kappa-derived artifact); raw trades stay in
# the fetch run's artifacts.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ladder-fetch run id with trades-* artifacts"
        required: true
      script:
        description: "analysis script"
        default: "scripts/ladder_v6x/kappa/prints_kappa.py"
      era:
        description: "main or early (unused by the kappa analysis)"
        default: "main"

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy pyarrow numba
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: trades-*
          path: art
      - name: Analyze
        run: |
          set -o pipefail
          python ${{ inputs.script }} art 2>&1 | tee reports/ladder_v6x/kappa/prints_log.txt
          python scripts/ladder_v6x/kappa/kappa.py 2>&1 | tee reports/ladder_v6x/kappa/kappa_log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kappa-derived
          path: |
            reports/ladder_v6x/kappa/prints_kappa.csv
            reports/ladder_v6x/kappa/prints_kappa_clip.csv
            reports/ladder_v6x/kappa/windows_cover.csv
            reports/ladder_v6x/kappa/kappa.csv
            reports/ladder_v6x/kappa/kappa_events.csv
            reports/ladder_v6x/kappa/kappa_clip.csv
            reports/ladder_v6x/kappa/prints_log.txt
            reports/ladder_v6x/kappa/kappa_log.txt
          retention-days: 14
      - name: Commit derived results
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "crypto-edge-bot"
          cd reports/ladder_v6x/kappa
          git add prints_kappa.csv prints_kappa_clip.csv windows_cover.csv kappa.csv kappa_events.csv kappa_clip.csv \
            prints_log.txt kappa_log.txt
          git diff --cached --quiet && exit 0
          git commit -q -F - <<'MSG'
          Ladder v6 exits, kappa(m): per-event print measurements and the kappa table (derived on Actions; raw prints stay in artifacts)

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01AEZT6kPaLhVZQWa1uXmv5Y
          MSG
          ok=0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin ${GITHUB_REF_NAME} && git push -q origin HEAD:${GITHUB_REF_NAME} && { ok=1; break; }
            sleep $((i*5))
          done
          [ "$ok" = 1 ]
