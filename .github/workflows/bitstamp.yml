name: fetch-bitstamp

on:
  workflow_dispatch:
    inputs:
      start:
        default: "2024-01-01"
      end:
        default: "2026-11-06"
      coins:
        default: '["BTC","ETH"]'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        coin: ${{ fromJSON(inputs.coins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - run: python scripts/fetch_bitstamp.py ${{ matrix.coin }} ${{ inputs.start }} ${{ inputs.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: bitstamp-${{ matrix.coin }}
          path: data/bitstamp/${{ matrix.coin }}.parquet
          if-no-files-found: ignore

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bitstamp-*
          path: data/bitstamp
          merge-multiple: true
      - name: Commit Bitstamp data
        run: |
          ls -la data/bitstamp || exit 0
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bitstamp
          git diff --cached --quiet && exit 0
          git commit -m "Bitstamp 1-minute history ${{ inputs.start }} to ${{ inputs.end }}"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
