name: daily-signals

on:
  workflow_run:
    workflows: ["daily-data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  signals:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/signals.py
      - name: Commit signals
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals
          git diff --cached --quiet && exit 0
          git commit -m "Signals $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
