name: fetch-hourly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ccxt pandas
      - run: python scripts/fetch_hourly.py
      - name: Commit hourly data
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hourly
          git diff --cached --quiet && exit 0
          git commit -m "Hourly price history $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
