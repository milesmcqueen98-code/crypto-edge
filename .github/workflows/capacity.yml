name: capacity-analysis

# Wick v4 addendum C1 (scripts/wick_v4/capacity.py): the simulator's fill capacity checked against the trade artifacts
# of a fetch-trades run. Only derived per-event numbers and the printed summary are committed; raw trades stay in the
# artifacts.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "fetch-trades run id"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/wick_v4
            reports/wick_v4
            reports/wick1m
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: trades-*
          path: art
      - name: Analyze
        run: python scripts/wick_v4/capacity.py art 2>&1 | tee reports/wick_v4/capacity_log.txt
      - name: Commit derived results
        if: always()
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/wick_v4/capacity_out.csv reports/wick_v4/capacity_log.txt
          git diff --cached --quiet && exit 0
          git commit -m "Wick v4 C1 capacity results (derived; raw trades stay in artifacts)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((i*5)); done
