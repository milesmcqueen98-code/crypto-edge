name: fetch-minute

on:
  workflow_dispatch:
    inputs:
      start:
        default: "2024-01-01"
      end:
        default: "2026-11-06"
      coins:
        default: '["BTC","ETH","SOL","XRP","DOGE","LTC","ADA","AVAX","LINK"]'
      outdir:
        default: "minute"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        coin: ${{ fromJSON(inputs.coins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ccxt pandas pyarrow
      - run: python scripts/fetch_minute.py ${{ matrix.coin }} ${{ inputs.start }} ${{ inputs.end }} ${{ inputs.outdir }}
      - uses: actions/upload-artifact@v4
        with:
          name: minute-${{ matrix.coin }}
          path: data/${{ inputs.outdir }}/${{ matrix.coin }}.parquet
          if-no-files-found: ignore

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: minute-*
          path: data/${{ inputs.outdir }}
          merge-multiple: true
      - name: Commit minute data
        run: |
          ls -la data/${{ inputs.outdir }}
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/${{ inputs.outdir }}
          git diff --cached --quiet && exit 0
          git commit -m "Minute price history ${{ inputs.start }} to ${{ inputs.end }} (${{ inputs.outdir }})"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*7)); done
