name: test-clock

# Starts the two kinds of test job by an event instead of GitHub's clock, which drops or delays most scheduled jobs:
#   - Part 3 of the trades-workers plan (reports/owner/trades_workers_plan.md): an alternating job, workers-alt.yml, each time
#     a run of the sixth book (paper-spot-tw) ends;
#   - measure 1(a) of Part 3 of the bar-source plan (reports/owner/bar_source_prereg.md): a same-machine pair, step-pairs.yml,
#     each time a run of the fifth book (paper-spot-r5) ends.
# The cron lines of step-pairs.yml and workers-alt.yml stay, and a job they start counts as before. Nobody chooses when a
# job runs: the start is the end of a paper run, by GitHub's event. Each target works out its own order from the UTC hour,
# so no input is passed.
# A job is started only if the completed run ended with success, was started by workflow_dispatch (the real paper runs all
# are; the scheduled backstop runs end cancelled) and lasted at least 30 minutes. The decision is made by
# scripts/owner/test_clock/decide.sh (test: scripts/owner/test_clock/decide_test.sh); anything else prints why and ends green.
on:
  workflow_run:
    workflows: ["paper-spot-r5", "paper-spot-tw"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts/owner/test_clock
      - name: Decide
        id: decide
        env:
          NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event.workflow_run.event }}
          STARTED: ${{ github.event.workflow_run.run_started_at }}
          UPDATED: ${{ github.event.workflow_run.updated_at }}
        run: |
          line=$(bash scripts/owner/test_clock/decide.sh)
          echo "$line"
          echo "line=$line" >> "$GITHUB_OUTPUT"
      - name: Start the test job
        if: ${{ startsWith(steps.decide.outputs.line, 'start ') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LINE: ${{ steps.decide.outputs.line }}
        run: |
          wf="${LINE#start }"
          gh workflow run "$wf" --repo "$REPO" --ref main
          echo "started $wf"
