name: hunt

# Edge hunt (reports/hunt_prereg.md): one generic runner for data fetches and heavy research jobs.
# Dispatch on any branch:  gh workflow run hunt.yml --ref <branch> -f script=scripts/hunt/x.py -f args="..." \
#                                                    -f commit="data/hunt/x reports/hunt/x" -f tag=x
# The script runs from the repo root. Paths listed in `commit` are committed back to the same branch;
# `artifact` paths are uploaded instead (raw data that is never committed).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "python script to run (repo-relative)"
        required: true
      args:
        description: "arguments"
        default: ""
      pip:
        description: "extra pip packages"
        default: ""
      commit:
        description: "space-separated paths to commit back to the branch"
        default: ""
      artifact:
        description: "space-separated paths to upload as an artifact"
        default: ""
      tag:
        description: "short label for the commit message and artifact"
        default: "run"
      sparse:
        description: "space-separated sparse-checkout paths (empty = whole repo)"
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Checkout scope
        run: |
          if [ -n "${{ inputs.sparse }}" ]; then git sparse-checkout set ${{ inputs.sparse }}; else git sparse-checkout disable; fi
          du -sh . 2>/dev/null | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy pyarrow requests scipy numba lightgbm statsmodels ${{ inputs.pip }}
      - name: Run
        run: |
          nproc; free -g
          python ${{ inputs.script }} ${{ inputs.args }}
      - name: Commit outputs
        if: inputs.commit != ''
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add --sparse -f ${{ inputs.commit }} || true
          git diff --cached --quiet && exit 0
          git commit -m "hunt ${{ inputs.tag }}: outputs ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5 6; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep $((5*i)); done
      - uses: actions/upload-artifact@v4
        if: inputs.artifact != ''
        with:
          name: hunt-${{ inputs.tag }}-${{ github.run_id }}
          path: ${{ inputs.artifact }}
          retention-days: 14
