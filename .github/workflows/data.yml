name: daily-data

on:
  schedule:
    - cron: "17 0 * * *"      # 00:17 UTC, just after the daily candle closes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_data.py", ".github/workflows/data.yml"]

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch prices
        run: python scripts/fetch_data.py prices
      - name: Commit prices
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Price update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
      - name: Fetch funding (time-boxed)
        continue-on-error: true
        run: python scripts/fetch_data.py funding
      - name: Commit funding
        run: |
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Funding update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
