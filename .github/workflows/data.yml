name: daily-data

on:
  schedule:
    - cron: "17 0 * * *"      # 00:17 UTC, just after the daily candle closes
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_data.py", ".github/workflows/data.yml"]

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
