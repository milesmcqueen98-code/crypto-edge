name: paper-smoke

# Short check that the bot runs against live Coinbase data from a cloud runner. Commits nothing.
on:
  workflow_dispatch:
    inputs:
      minutes:
        default: "8"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy lightgbm requests pyarrow
      - name: R2-08 (strategy of record) and v1 (control) side by side
        run: |
          python bot/run.py --mode paper --minutes ${{ inputs.minutes }} --model-dir bot --state-dir /tmp/smoke &
          python bot/run.py --mode paper --minutes ${{ inputs.minutes }} --model-dir bot/v2 --state-dir /tmp/smoke_v2 &
          wait
      - if: always()
        run: |
          echo "---- v1 events"; cat /tmp/smoke/events.jsonl || true
          echo "---- v2 events"; cat /tmp/smoke_v2/events.jsonl || true
          echo "---- v2 state"; cat /tmp/smoke_v2/state.json || true
