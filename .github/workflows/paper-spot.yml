name: paper-spot

# Forward paper test of the spot bot with the $1M rules (bot/spot/, $250K paper capital, capture 0.5, VIP-1 fees) on
# live public Coinbase data: no keys, no money. Each job runs ~5h45m; the schedule restarts it every 6 hours, and the
# bot settles the gap from the candles (catch_up). State carries over through paper_spot/state.json.
on:
  schedule:
    - cron: "33 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        default: "345"

concurrency:
  group: paper-spot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          # the branch tip, not the trigger commit: a run queued behind the previous one must start from the state that
          # run committed (on Nov 7 a run started from the stale trigger commit and its log could not be pushed)
          ref: main
          sparse-checkout: |
            bot
            edge
            reports
            paper_spot
            paper_spot_w2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy lightgbm requests pyarrow
      - name: Paper trade the spot bot ($1M rules, $250K) and the W2 rung-weight challenger side by side
        run: |
          M=${{ inputs.minutes || '345' }}
          python bot/spot/run.py paper --minutes $M > spot.out 2>&1 &
          # wick v4 W2 challenger (1/4, 1/4, 1/2): failed the pre-registered rule, looked better post hoc; forward A/B
          python bot/spot/run.py paper --minutes $M --config bot/spot/config.w2.json --state-dir paper_spot_w2 > w2.out 2>&1 &
          wait
          grep -E '"kind": "(fill_entry|fill_exit|halt|error|warning|catch_up)"' spot.out | tail -n 30 || true
          python bot/spot/run.py report | tail -n 30
          python bot/spot/run.py report --state-dir paper_spot_w2 | tail -n 30
      - name: Commit paper log
        if: always()
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_spot paper_spot_w2 2>/dev/null || git add paper_spot
          git diff --cached --quiet && exit 0
          git commit -m "Spot paper log $(date -u +%Y-%m-%dT%H:%MZ)"
          # -X theirs: on a conflict in the paper logs this run's (newer) version wins instead of the push failing
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done

  # newest minute from the venue's trades for the coins in trades_coins, with the stale-input guard (bot/spot/README.md,
  # "Newest minute from trades"). Its own runner, so the two books above keep their requests and rate as before.
  paper_tb:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            bot
            edge
            reports
            paper_spot_tb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy lightgbm requests pyarrow
      - name: Paper trade the trades book
        run: |
          M=${{ inputs.minutes || '345' }}
          python bot/spot/run.py paper --minutes $M --config bot/spot/config.tb.json --state-dir paper_spot_tb > tb.out 2>&1 || echo "paper run exited with code $?"
          grep -E '"kind": "(fill_entry|fill_exit|halt|error|warning|catch_up|heartbeat)"' tb.out | tail -n 30 || true
          python bot/spot/run.py report --state-dir paper_spot_tb | tail -n 30
      - name: Commit paper log
        if: always()
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "crypto-edge-bot.users.noreply.github.com"
          git add paper_spot_tb
          git diff --cached --quiet && exit 0
          git commit -m "Spot paper log (trades book) $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done

  # hand-over: start the next run on main when this one ran at least 30 minutes (bot/spot/deploy/paper_next.sh), so the
  # books do not depend on GitHub's dropped schedules. The cron line above stays as the backstop.
  next:
    needs: [paper, paper_tb]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: bot/spot/deploy
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: bash bot/spot/deploy/paper_next.sh
