name: paper-trade

# Forward paper test of the AI-filtered resting-bid dip buyer on live Coinbase data (no keys, no money):
# R2-08 (bot/v2/, the strategy of record, log paper_v2/) and v1 (bot/, the control, log paper/) side by side.
# Each job runs ~5h45m; the schedule restarts it every 6 hours. State carries over through paper/state.json.
on:
  schedule:
    - cron: "3 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        default: "345"

concurrency:
  group: paper-trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          # the branch tip, not the trigger commit: a run queued behind the previous one must start from the state that
          # run committed (on Nov 11 a queued run started from its stale trigger commit, ran six hours and could not push
          # its log)
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy lightgbm requests pyarrow
      - name: Paper trade R2-08 (strategy of record) and v1 (control) side by side
        run: |
          M=${{ inputs.minutes || '345' }}
          # R2-08 (bot/v2/, the strategy of record since Nov 6): realistic-cost label, 60th-pct threshold, 7-day beta
          python bot/run.py --mode paper --minutes $M --model-dir bot/v2 --state-dir paper_v2 > v2.out 2>&1 &
          # v1 (bot/), kept running as the control
          python bot/run.py --mode paper --minutes $M --model-dir bot --state-dir paper > v1.out 2>&1 &
          wait
          tail -n 25 v1.out v2.out
      - name: Commit paper log
        if: always()
        run: |
          git config user.name "crypto-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          bash bot/spot/deploy/paper_commit.sh "Paper trading log $(date -u +%Y-%m-%dT%H:%MZ)" paper paper_v2
